name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.4.335.0
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '~/vulkan-sdk' || 'C:\VulkanSDK' }}
          key: vulkan-sdk-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -d ~/vulkan-sdk/$VULKAN_SDK_VERSION ]; then
            mkdir -p ~/vulkan-sdk
            curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz" | tar -xJ -C ~/vulkan-sdk
          fi
          echo "VULKAN_SDK=$HOME/vulkan-sdk/$VULKAN_SDK_VERSION/x86_64" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path $sdk)) {
            curl.exe -fsSL -o vulkan_sdk.exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
            $p = Start-Process .\vulkan_sdk.exe -Wait -PassThru -ArgumentList '--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer failed with $($p.ExitCode)" }
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DMYTH_BUILD_SAMPLES=OFF
          -DMYTH_BUILD_TESTS=OFF
          -DMYTH_ENABLE_IMGUI_STANDARD=ON
          -DMYTH_ENABLE_TRACY=ON

      - name: Build
        run: cmake --build build --config Debug --target mythril --parallel
